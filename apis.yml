aid: replicated
name: Replicated
description: >-
  Replicated is a commercial software distribution platform that lets independent
  software vendors (ISVs) deliver and manage modern applications into complex,
  customer-controlled environments — including on-prem, self-hosted, and air-gapped
  networks with little or no outbound internet access. The platform spans the
  Vendor Portal, the Replicated CLI, Embedded Cluster and KOTS installers, the
  Enterprise Portal for end customers, a proxy registry, the Compatibility Matrix
  (CMX) for ephemeral test clusters/VMs, preflight checks, support bundles, and
  instance telemetry. Its Vendor API v3 (api.replicated.com/vendor/v3) exposes 217
  operations across apps, channels, releases, customers, licenses, clusters, VMs,
  registries, and event notifications, secured with token auth. Replicated is
  backed by Amplify Partners and is SOC 2 / CSA STAR attested.
