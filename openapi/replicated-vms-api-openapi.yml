openapi: 3.2.0
info:
  description: Manage enterprise portal users, install options, branding, documentation, email templates, and access control.
  title: Vendor API V3 Vms API
  contact:
    name: Replicated, Inc.
    url: http://www.replicated.com/
    email: info@replicated.com
  version: 3.0.0
servers:
- url: https://api.replicated.com/vendor/v3
tags:
- name: VMs
paths:
  /vm:
    post:
      security:
      - api_key: []
      description: 'Required RBAC Policy: kots/vm/create'
      tags:
      - VMs
      summary: Create a test vm
      operationId: createVM
      parameters:
      - name: DryRun
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/createVMDryRunResponse'
        '201':
          $ref: '#/components/responses/createVMResponse'
        '400':
          $ref: '#/components/responses/createVMErrorResponse'
        '401':
          $ref: '#/components/responses/responseErrUnauthorized'
        '403':
          $ref: '#/components/responses/responseErrForbidden'
        '404':
          $ref: '#/components/responses/responseErrNotFound'
      servers:
      - url: https://api.replicated.com/vendor/v3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVMParametersBody'
  /vm/versions:
    get:
      security:
      - api_key: []
      tags:
      - VMs
      summary: List vm versions
      operationId: listVMVersions
      responses:
        '200':
          $ref: '#/components/responses/listVMVersionsResponse'
        '400':
          $ref: '#/components/responses/responseErrBadRequest'
        '401':
          $ref: '#/components/responses/responseErrUnauthorized'
        '403':
          $ref: '#/components/responses/responseErrForbidden'
        '404':
          $ref: '#/components/responses/responseErrNotFound'
      servers:
      - url: https://api.replicated.com/vendor/v3
  /vm/{vm_id}:
    get:
      security:
      - api_key: []
      description: 'Required RBAC Policy: kots/vm/[:vmid]'
      tags:
      - VMs
      summary: Get the details for a test vm
      operationId: getVM
      parameters:
      - x-go-name: VMID
        description: VM identifier
        name: vm_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/getVMResponse'
        '400':
          $ref: '#/components/responses/responseErrBadRequest'
        '401':
          $ref: '#/components/responses/responseErrUnauthorized'
        '403':
          $ref: '#/components/responses/responseErrForbidden'
        '404':
          $ref: '#/components/responses/responseErrNotFound'
      servers:
      - url: https://api.replicated.com/vendor/v3
    delete:
      security:
      - api_key: []
      description: 'Required RBAC Policy: kots/vm/[:vmid]/delete'
      tags:
      - VMs
      summary: Delete a test vm
      operationId: deleteVM
      parameters:
      - x-go-name: VMID
        description: VM identifier
        name: vm_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/deleteVMResponse'
        '400':
          $ref: '#/components/responses/responseErrBadRequest'
        '401':
          $ref: '#/components/responses/responseErrUnauthorized'
        '403':
          $ref: '#/components/responses/responseErrForbidden'
        '404':
          $ref: '#/components/responses/responseErrNotFound'
      servers:
      - url: https://api.replicated.com/vendor/v3
  /vm/{vm_id}/port:
    post:
      security:
      - api_key: []
      description: 'Required RBAC Policy: kots/vm/[:vmid]/port/expose'
      tags:
      - VMs
      summary: Exposes a port on a vm
      operationId: createVMPort
      parameters:
      - x-go-name: VMID
        description: VM identifier
        name: vm_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/createVMPortResponse'
        '401':
          $ref: '#/components/responses/responseErrUnauthorized'
        '403':
          $ref: '#/components/responses/responseErrForbidden'
        '404':
          $ref: '#/components/responses/responseErrNotFound'
      servers:
      - url: https://api.replicated.com/vendor/v3
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - port
              - protocols
              properties:
                is_wildcard:
                  description: IsWildcard
                  type: boolean
                  x-go-name: IsWildcard
                port:
                  description: Port Number
                  type: integer
                  format: int64
                  x-go-name: Port
                protocols:
                  description: Protocols
                  type: array
                  items:
                    $ref: '#/components/schemas/PortProtocol'
                  x-go-name: Protocols
  /vm/{vm_id}/ports:
    get:
      security:
      - api_key: []
      description: 'Required RBAC Policy: kots/vm/[:vmid]/port/list'
      tags:
      - VMs
      summary: Lists ports for a vm
      operationId: listVMPorts
      parameters:
      - x-go-name: VMID
        description: VM identifier
        name: vm_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/listVMPortsResponse'
        '400':
          $ref: '#/components/responses/responseErrBadRequest'
        '401':
          $ref: '#/components/responses/responseErrUnauthorized'
        '403':
          $ref: '#/components/responses/responseErrForbidden'
        '404':
          $ref: '#/components/responses/responseErrNotFound'
      servers:
      - url: https://api.replicated.com/vendor/v3
  /vm/{vm_id}/tags:
    put:
      security:
      - api_key: []
      description: 'Required RBAC Policy: kots/vm/tag/update'
      tags:
      - VMs
      summary: Update the tags for a vm
      operationId: updateVMTags
      parameters:
      - x-go-name: VMID
        description: VM identifier
        name: vm_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          $ref: '#/components/responses/updateVMTagsResponse'
        '401':
          $ref: '#/components/responses/responseErrUnauthorized'
        '403':
          $ref: '#/components/responses/responseErrForbidden'
        '404':
          $ref: '#/components/responses/responseErrNotFound'
      servers:
      - url: https://api.replicated.com/vendor/v3
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/Tag'
                  x-go-name: Tags
  /vm/{vm_id}/ttl:
    put:
      security:
      - api_key: []
      description: 'Required RBAC Policy: kots/vm/ttl/update'
      tags:
      - VMs
      summary: Update ttl for a VM
      operationId: updateVMTTL
      parameters:
      - x-go-name: VMID
        description: VM identifier
        name: vm_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/updateVMTTLResponse'
        '400':
          $ref: '#/components/responses/updateVMTTLErrorResponse'
        '401':
          $ref: '#/components/responses/responseErrUnauthorized'
        '403':
          $ref: '#/components/responses/responseErrForbidden'
        '404':
          $ref: '#/components/responses/responseErrNotFound'
      servers:
      - url: https://api.replicated.com/vendor/v3
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl:
                  type: string
                  x-go-name: TTL
  /vms:
    get:
      security:
      - api_key: []
      description: 'Required RBAC Policy: kots/vm/list'
      tags:
      - VMs
      summary: List test vms
      operationId: listVMs
      responses:
        '200':
          $ref: '#/components/responses/listVMsResponse'
        '400':
          $ref: '#/components/responses/responseErrBadRequest'
        '401':
          $ref: '#/components/responses/responseErrUnauthorized'
        '403':
          $ref: '#/components/responses/responseErrForbidden'
        '404':
          $ref: '#/components/responses/responseErrNotFound'
      servers:
      - url: https://api.replicated.com/vendor/v3
components:
  responses:
    updateVMTTLResponse:
      description: UpdateVMTTLResponse contains the response to update a VM ttl
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                x-go-name: Error
              vm:
                $ref: '#/components/schemas/VM'
    updateVMTagsResponse:
      description: UpdateVMTagsResponse contains the response to update a vm tags
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                x-go-name: Error
              vm:
                $ref: '#/components/schemas/VM'
    listVMPortsResponse:
      description: ListVMPortsResponse contains the response to a list vm [prts] request
      content:
        application/json:
          schema:
            type: object
            properties:
              addons:
                type: array
                items:
                  $ref: '#/components/schemas/VMAddon'
                x-go-name: Addons
              ports:
                type: array
                items:
                  $ref: '#/components/schemas/VMPort'
                x-go-name: Ports
    createVMPortResponse:
      description: CreateVMPortResponse contains the response to a create vm port request
      content:
        application/json:
          schema:
            type: object
            properties:
              addon:
                $ref: '#/components/schemas/VMAddon'
              port:
                $ref: '#/components/schemas/VMPort'
    responseErrForbidden:
      description: Returned if the caller does not have the needed permission
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
                    x-go-name: Message
                  messageCode:
                    type: string
                    x-go-name: MessageCode
                x-go-name: Error
    listVMsResponse:
      description: ListVMsResponse contains the response to list vms
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                x-go-name: Error
              totalVMs:
                type: integer
                format: int64
                x-go-name: TotalVMs
              vms:
                type: array
                items:
                  $ref: '#/components/schemas/VM'
                x-go-name: VMs
    getVMResponse:
      description: GetVMResponse contains the response to get vm details
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                x-go-name: Error
              vm:
                $ref: '#/components/schemas/VM'
    createVMResponse:
      description: CreateVMResponse contains the response to create a vm
      content:
        application/json:
          schema:
            type: object
            properties:
              vms:
                type: array
                items:
                  $ref: '#/components/schemas/VM'
                x-go-name: VMs
    listVMVersionsResponse:
      description: ListVMVersionsResponse contains the response to list clusters
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                x-go-name: Error
              vm-versions:
                type: array
                items:
                  $ref: '#/components/schemas/VMSupportedDistributionAndVersions'
                x-go-name: VMs
    createVMDryRunResponse:
      description: CreateVMDryRunResponse contains the response to a dry run of creating a vm
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                $ref: '#/components/schemas/CreateVMError'
              total_cost:
                type: integer
                format: int64
                x-go-name: TotalCost
              ttl:
                type: string
                x-go-name: TTL
    deleteVMResponse:
      description: DeleteVMResponse contains the response to delete a vm
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                x-go-name: Error
    createVMErrorResponse:
      description: CreateVMErrorResponse contains error information
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateVMError'
    responseErrUnauthorized:
      description: Return if the caller is not authorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                x-go-name: Message
    updateVMTTLErrorResponse:
      description: UpdateVMTTLErrorResponse contains error information
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                x-go-name: Message
    responseErrNotFound:
      description: Returned on resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                x-go-name: Message
    responseErrBadRequest:
      description: Returned on bad input
      content:
        application/json:
          schema:
            type: object
            properties:
              error_code:
                description: Error code if available
                type: string
                x-go-name: ErrorCode
              message:
                description: Error message text if available
                type: string
                x-go-name: Message
  schemas:
    VMAddon:
      type: object
