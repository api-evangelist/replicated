        id:
          type: string
          x-go-name: ShortID
        port:
          $ref: '#/components/schemas/VMAddonPort'
        ready_at:
          type: string
          format: date-time
          x-go-name: ReadyAt
        status:
          $ref: '#/components/schemas/VMAddonStatus'
        terminated_at:
          type: string
          format: date-time
          x-go-name: TerminatedAt
        total_credits:
          type: integer
          format: int64
          x-go-name: TotalCredits
        vm_guid:
          type: string
          x-go-name: VMGUID
        vm_id:
